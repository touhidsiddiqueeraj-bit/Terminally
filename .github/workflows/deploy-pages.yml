name: Deploy to GitHub Pages

# Builds the static export with the repository subpath as BASE_PATH
# (project pages live at https://<user>.github.io/<repo>/) and deploys it
# to GitHub Pages. One-time setup: repo Settings → Pages → Source: GitHub Actions.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build static site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The repo must be in Settings → Pages → Source: "GitHub Actions"
      # (build_type: workflow). We can't create or update the site through a
      # PAT lacking Pages write, so switch it here with this workflow's
      # GITHUB_TOKEN (which HAS pages: write). Idempotent: 204 = switched,
      # 422/409 = already in workflow mode, anything else is logged but
      # non-fatal (configure-pages below reports the real state).
      - name: Switch Pages to "GitHub Actions" deployment mode
        run: |
          CODE=$(curl -s -o /tmp/pages-resp.json -w "%{http_code}" -X PUT \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/pages \
            -d '{"build_type":"workflow"}') || CODE=curl-failed
          echo "PUT /pages → HTTP $CODE"
          cat /tmp/pages-resp.json 2>/dev/null || true
          test "$CODE" = "204" || test "$CODE" = "422" || test "$CODE" = "409" \
            || echo "::warning::could not switch Pages mode (HTTP $CODE) — deploy may fail until Source is set to GitHub Actions in repo settings"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build static export
        env:
          BASE_PATH: /${{ github.event.repository.name }}
        run: bun run build:static

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Enables GitHub Pages on the repo (Settings → Pages → Source:
          # GitHub Actions) on first run, using this workflow's GITHUB_TOKEN.
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

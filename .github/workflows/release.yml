name: Release

# Manual release builder. Releases are published by hand with the
# release-signed APK (the keystore never leaves the maintainer's machine),
# so this workflow exists to automate everything AROUND the signing:
#
#   Run it from the Actions tab → "Release" → "Run workflow" with a tag
#   name (e.g. v1.0.0). It builds the static site, a debug-signed APK and
#   the ready-to-open Android project, then attaches them to that release.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag to publish to, e.g. v1.0.0'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  release:
    name: Build & publish release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # ubuntu-latest ships a full Android SDK at $ANDROID_HOME; install the
      # exact components with the bundled sdkmanager. (android-actions/
      # setup-android is currently broken: the legacy `tools` package it
      # updates no longer exists upstream.)
      - name: Install Android SDK components
        run: |
          set -e
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(ls -1 "${ANDROID_HOME}"/cmdline-tools/*/bin/sdkmanager | tail -1)"
          fi
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platforms;android-34" "build-tools;34.0.0" platform-tools > /dev/null

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate content before packaging
        run: |
          bun run validate:content
          bun run verify:exercises

      - name: Build static export
        run: bun run build:static

      - name: Package site zip
        run: cd out && zip -qr "../terminally-site-${{ inputs.version }}.zip" . && cd ..

      - name: Sync assets into Android project
        run: ./android/sync-assets.sh

      # Debug-signed with the runner's debug key → sideload-ready APK.
      # To ship release-signed builds, add keystore.properties + keystore as
      # repo secrets and switch to `assembleRelease` (see android/README.md).
      - name: Build Android APK
        run: cd android && ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: |
          mv android/app/build/outputs/apk/debug/app-debug.apk \
             "TerminalAcademy-${{ inputs.version }}.apk"

      - name: Package Android project zip
        run: >
          zip -qr "terminally-android-project-${{ inputs.version }}.zip" android
          -x "android/.gradle/*" "android/app/build/*" "android/local.properties"
          "android/keystore.properties" "android/keystores/*"

      # Creates the tag if it does not exist yet; uploads the debug APK and
      # zips as release assets (the release-signed APK is uploaded by hand).
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          generate_release_notes: true
          files: |
            TerminalAcademy-${{ inputs.version }}.apk
            terminally-site-${{ inputs.version }}.zip
            terminally-android-project-${{ inputs.version }}.zip

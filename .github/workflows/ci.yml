name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: Lint · Types · Content · Exercises · Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Validate course content
        run: bun run validate:content

      - name: Verify coding exercises
        run: bun run verify:exercises

      - name: Build static export
        run: bun run build:static

      - name: Upload site artifact
        uses: actions/upload-artifact@v4
        with:
          name: terminally-static-site
          path: out
          retention-days: 7

  apk:
    name: Android APK
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build static export
        run: bun run build:static

      - name: Sync site into Android assets
        run: ./android/sync-assets.sh

      # Debug-signed with the runner's debug key → directly installable.
      # For a release-signed APK see android/README.md (keystore.properties).
      - name: Build APK
        run: cd android && ./gradlew assembleDebug --no-daemon

      - name: Sanity-check the packaged assets
        run: |
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep -q "assets/index.html"
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep -q "assets/_next/"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: terminal-academy-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
